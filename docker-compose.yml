services:
  postgres:
    image: postgres:latest
    container_name: golang_postgres_crud
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin1111
      POSTGRES_DB: urls_db
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5422:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: golang_app_crud
    ports:
      - "8082:8082"
    environment:
      PSQLCRUD_CFG: /app/config/config.yaml
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: postgres
      PG_PASSWORD: admin1111
      PG_DB: urls_db
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

volumes:
  pgdata:
    driver: local
